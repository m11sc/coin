name: crypto-signals

on:
  schedule:
    - cron: "*/5 * * * *"    # каждые 5 минут — минимум у GitHub. Для приватного репозитория ставь "*/30 * * * *"
  workflow_dispatch:          # кнопка ручного запуска во вкладке Actions

# не запускать новую проверку, пока не закончилась предыдущая
concurrency:
  group: crypto-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Память о уже отправленных сигналах, чтобы не слать повторы
      - uses: actions/cache/restore@v4
        with:
          path: signals_state.json
          key: signals-state-${{ github.run_id }}
          restore-keys: signals-state-

      - name: Проверить сигналы
        run: python crypto_signals.py
        env:
          RUN_ONCE: "1"
          EXCHANGE: coinbase
          SYMBOLS: ${{ vars.SYMBOLS }}      # список пар через запятую или ALL — все пары к доллару
          MIN_VOLUME_USD: ${{ vars.MIN_VOLUME_USD }}  # для ALL: минимальный оборот за сутки, по умолчанию 5000000
          INTERVAL: ${{ vars.INTERVAL }}    # необязательно, по умолчанию 1h
          LEVERAGE: ${{ vars.LEVERAGE }}    # плечо, например 20 (по умолчанию 1 — спот)
          DEPOSIT: ${{ vars.DEPOSIT }}      # необязательно: депозит в $, чтобы бот считал маржу
          RISK_PCT: ${{ vars.RISK_PCT }}    # необязательно: % депозита на сделку, по умолчанию 1
          ALLOW_SHORT: ${{ vars.ALLOW_SHORT }}  # 0 — только лонги, по умолчанию шорты включены
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: signals_state.json
          key: signals-state-${{ github.run_id }}
